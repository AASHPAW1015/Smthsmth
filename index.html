<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Area Calculator</title>
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
  :root {
    --bg: #111827; --panel: rgba(17,24,39,.92); --fg: #f9fafb; --muted: #9ca3af;
    --accent: #facc15; --danger: #ef4444; --ok: #22c55e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  #map { position: fixed; inset: 0; }

  #top { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px; z-index: 1000;
    display: flex; flex-direction: column; align-items: flex-end; gap: 8px; pointer-events: none; }
  #stats { align-self: stretch; pointer-events: auto;
    background: var(--panel); border-radius: 14px; padding: 10px 14px; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
  #mini { width: 120px; height: 120px; border-radius: 12px; overflow: hidden; pointer-events: auto;
    border: 2px solid #fff; box-shadow: 0 4px 16px rgba(0,0,0,.5); display: none; background: #222; }
  #walkInfo { font-size: 14px; color: #38bdf8; margin-top: 4px; font-weight: 600; display: none; }
  .elabel { position: absolute; left: 0; top: 0; white-space: nowrap; pointer-events: none;
    font-size: 12px; font-weight: 700; color: #fff; background: rgba(0,0,0,.6);
    padding: 1px 6px; border-radius: 8px; transform-origin: 0 0; }
  #areaMain { font-size: 26px; font-weight: 700; color: var(--accent); cursor: pointer; user-select: none; }
  #areaMain small { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 6px; }
  #areaAlt, #perim { font-size: 13px; color: var(--muted); margin-top: 2px; }
  #warn { font-size: 13px; color: var(--danger); margin-top: 4px; display: none; }
  #gpsInfo { font-size: 12px; color: var(--muted); margin-top: 2px; }

  #bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000;
    padding: 8px 8px max(8px, env(safe-area-inset-bottom)); background: var(--panel);
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
  #bar button { background: #1f2937; color: var(--fg); border: 0; border-radius: 12px;
    padding: 8px 1px; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  #bar button .ic { font-size: 20px; line-height: 1; }
  #bar button:active { background: #374151; }
  #bar button.on { background: var(--accent); color: #111; }
  #bar button:disabled { opacity: .4; }
  #bar button.walking { background: var(--danger); color: #fff; }

  #toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); z-index: 1100;
    background: #000c; color: #fff; padding: 8px 14px; border-radius: 20px; font-size: 14px;
    opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; }

  .vtx { width: 22px; height: 22px; border-radius: 50%; background: var(--accent);
    border: 3px solid #111; box-shadow: 0 0 0 2px #fff; display: flex; align-items: center;
    justify-content: center; font-size: 10px; font-weight: 700; color: #111; }
  .vtx.first { background: var(--ok); }
  .vtx.mark { background: var(--danger); color: #fff; }
  #sheet { position: fixed; inset: 0; z-index: 1200; background: rgba(0,0,0,.5);
    display: flex; align-items: flex-end; }
  #sheet[hidden] { display: none; }
  #sheet .card { width: 100%; background: #111827; border-radius: 18px 18px 0 0;
    padding: 12px 12px max(12px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; }
  #sheet button { background: #1f2937; color: var(--fg); border: 0; border-radius: 12px; padding: 14px;
    font-size: 16px; text-align: left; }
  #sheet button small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  #sheet button.danger { color: #fca5a5; }
  #sheet button:disabled { opacity: .4; }
  #sheet button[data-act="close"] { text-align: center; background: transparent; }
  .me { width: 16px; height: 16px; border-radius: 50%; background: #3b82f6; border: 3px solid #fff;
    box-shadow: 0 0 0 2px #3b82f6; }
  .leaflet-control-attribution { font-size: 9px; }
  .leaflet-bottom { bottom: 70px; }
  .popbtn { background: var(--danger); color: #fff; border: 0; border-radius: 8px; padding: 6px 12px; font-size: 14px; }
</style>
</head>
<body>
<div id="map"></div>

<div id="top">
  <div id="stats">
    <div id="areaMain">Tap the map to add points</div>
    <div id="areaAlt"></div>
    <div id="perim"></div>
    <div id="walkInfo"></div>
    <div id="warn">⚠ Lines cross each other, so the area is wrong. Drag points to fix.</div>
    <div id="gpsInfo"></div>
  </div>
  <div id="mini" title="Overview: the red box is what you're looking at"></div>
</div>

<div id="bar">
  <button id="btnLock" title="Lock map taps"><span class="ic">✋</span><span>Adding</span></button>
  <button id="btnWalk"><span class="ic">🚶</span><span>Walk</span></button>
  <button id="btnMark"><span class="ic">📌</span><span>Mark</span></button>
  <button id="btnLocate"><span class="ic">🎯</span><span>Find me</span></button>
  <button id="btnUndo"><span class="ic">↩️</span><span>Undo</span></button>
  <button id="btnMore"><span class="ic">☰</span><span>More</span></button>
</div>

<div id="sheet" hidden>
  <div class="card">
    <button data-act="saveGeo">💾 Save to phone <small>.geojson · open it here again later</small></button>
    <button data-act="saveKml">🌍 Save for Google Earth <small>.kml</small></button>
    <button data-act="open">📂 Open a saved file <small>.geojson, .kml, or .gpx from a GPS logger</small></button>
    <button data-act="clear" class="danger">🗑️ Clear all points</button>
    <button data-act="close">Close</button>
  </div>
</div>
<input type="file" id="fileIn" hidden>
<div id="toast"></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script>
(function () {
  'use strict';

  // ---------- Map setup ----------
  const STORE_KEY = 'areacalc.v1';
  const saved = load();

  const map = L.map('map', {
    zoomControl: false,
    center: saved.view ? saved.view.center : [20, 0],
    zoom: saved.view ? saved.view.zoom : 3,
    maxZoom: 22,
  });

  // ---------- Satellite imagery ----------
  // Esri World Imagery: free satellite tiles, no API key needed. How deep the photos go
  // varies by place (z17 in some areas, z20+ in others). Where a zoom level has no photo,
  // Esri serves a grey "Map data not yet available" tile. To avoid that, we ask Esri's
  // tilemap service which levels really exist and draw the deepest real photo, enlarged.
  const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer';
  const MAX_UPSCALE = 6;   // look up to 6 levels shallower (photo enlarged at most 64x)
  const BLOCK = 32;        // tilemap answers cover 32x32 tiles per request
  const tilemapCache = new Map();

  function tilemapBlock(z, row, col) {
    const r0 = Math.floor(row / BLOCK) * BLOCK, c0 = Math.floor(col / BLOCK) * BLOCK;
    const key = z + '/' + r0 + '/' + c0;
    if (!tilemapCache.has(key)) {
      tilemapCache.set(key, fetch(`${ESRI}/tilemap/${z}/${r0}/${c0}/${BLOCK}/${BLOCK}`)
        .then(r => (r.ok ? r.json() : null))
        .then(j => (j && Array.isArray(j.data) && j.location ? j : null))
        .catch(() => null));
    }
    return tilemapCache.get(key);
  }

  // true = photo exists, false = Esri says it doesn't, null = unknown (just try loading it).
  async function hasTile(z, row, col) {
    const j = await tilemapBlock(z, row, col);
    if (!j) return null;
    const { left, top, width, height } = j.location;
    if (col < left || row < top || col >= left + width || row >= top + height) return null;
    return j.data[(row - top) * width + (col - left)] === 1;
  }

  // How many levels to go up from tile (z, x, y) to reach a real photo.
  async function levelsUp(z, x, y) {
    const n = Math.min(MAX_UPSCALE, z);
    const checks = [];
    for (let d = 0; d <= n; d++) checks.push(hasTile(z - d, y >> d, x >> d));
    const res = await Promise.all(checks);
    const d = res.findIndex(ok => ok !== false);
    return d === -1 ? 0 : d;
  }

  const EsriImagery = L.GridLayer.extend({
    createTile(coords, done) {
      const tile = document.createElement('div');
      tile.style.overflow = 'hidden';
      levelsUp(coords.z, coords.x, coords.y).then(d => this._draw(tile, coords, d, done));
      return tile;
    },
    // Draw the right piece of the ancestor tile `d` levels up, scaled to fill this tile.
    _draw(tile, c, d, done) {
      const size = this.getTileSize(), k = 1 << d;
      const z = c.z - d, x = c.x >> d, y = c.y >> d;
      const img = new Image();
      img.alt = '';
      Object.assign(img.style, {
        position: 'absolute', maxWidth: 'none',
        width: size.x * k + 'px', height: size.y * k + 'px',
        left: -(c.x - x * k) * size.x + 'px', top: -(c.y - y * k) * size.y + 'px',
      });
      img.onload = () => { tile.replaceChildren(img); done(null, tile); };
      // blankTile=false: Esri answers 404 instead of a blank tile, so we can go up a level.
      img.onerror = () => (d < MAX_UPSCALE && z > 0
        ? this._draw(tile, c, d + 1, done)
        : done(new Error('no imagery'), tile));
      img.src = `${ESRI}/tile/${z}/${y}/${x}?blankTile=false`;
    },
  });

  new EsriImagery({
    maxZoom: 22,
    attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics',
  }).addTo(map);
  // Road / place labels on top of the imagery so you can find your way around.
  const labels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
    maxNativeZoom: 19, maxZoom: 22, opacity: 0.8,
  }).addTo(map);
  L.control.layers(null, { 'Labels': labels }, { position: 'bottomright' }).addTo(map);

  const polygon = L.polygon([], { color: '#facc15', weight: 3, fillOpacity: 0.25 }).addTo(map);
  const markers = [];
  let points = (saved.points || []).map(a => deser(a));
  let locked = false;
  let walk = null; // set while tracking a walk around the boundary

  // ---------- Geometry ----------
  const A_WGS84 = 6378137, E2_WGS84 = 0.00669437999014; // WGS84 ellipsoid
  const rad = d => d * Math.PI / 180;

  // Gaussian radius of curvature sqrt(M*N) of the WGS84 ellipsoid at a latitude:
  // the radius of the sphere that best matches the real Earth's surface locally.
  function localRadius(latDeg) {
    const s = Math.sin(rad(latDeg)), w = Math.sqrt(1 - E2_WGS84 * s * s);
    const M = A_WGS84 * (1 - E2_WGS84) / (w * w * w), N = A_WGS84 / w;
    return Math.sqrt(M * N);
  }

  // Polygon area via spherical excess (as in Leaflet.draw / OpenLayers), but scaled
  // with the ellipsoid's local radius instead of a fixed one. Using the equatorial
  // radius would be off by up to ~0.7% depending on latitude; this is ~0.01%
  // for anything field- or farm-sized.
  function geodesicArea(pts) {
    if (pts.length < 3) return 0;
    let a = 0, lat = 0;
    for (let i = 0; i < pts.length; i++) {
      const p1 = pts[i], p2 = pts[(i + 1) % pts.length];
      a += rad(p2.lng - p1.lng) * (2 + Math.sin(rad(p1.lat)) + Math.sin(rad(p2.lat)));
      lat += p1.lat;
    }
    const R = localRadius(lat / pts.length);
    return Math.abs(a * R * R / 2);
  }

  // Distance in metres on the WGS84 ellipsoid (local radii of curvature). Exact to
  // well under a centimetre for parcel-sized edges; fine up to tens of km.
  function dist(a, b) {
    const latm = rad((a.lat + b.lat) / 2), s = Math.sin(latm), w = Math.sqrt(1 - E2_WGS84 * s * s);
    const M = A_WGS84 * (1 - E2_WGS84) / (w * w * w), N = A_WGS84 / w;
    return Math.hypot(rad(b.lat - a.lat) * M, rad(b.lng - a.lng) * N * Math.cos(latm));
  }

  function perimeter(pts) {
    if (pts.length < 2) return 0;
    let d = 0;
    const n = pts.length < 3 ? pts.length - 1 : pts.length;
    for (let i = 0; i < n; i++) d += dist(pts[i], pts[(i + 1) % pts.length]);
    return d;
  }

  // True if any two non-adjacent edges cross (area would be meaningless).
  function selfIntersects(pts) {
    const n = pts.length;
    if (n < 4) return false;
    const cross = (a, b, c) => (b.lng - a.lng) * (c.lat - a.lat) - (b.lat - a.lat) * (c.lng - a.lng);
    const segX = (p1, p2, p3, p4) => {
      const d1 = cross(p3, p4, p1), d2 = cross(p3, p4, p2), d3 = cross(p1, p2, p3), d4 = cross(p1, p2, p4);
      return ((d1 > 0) !== (d2 > 0)) && ((d3 > 0) !== (d4 > 0));
    };
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        if (j === i + 1 || (i === 0 && j === n - 1)) continue; // adjacent edges
        if (segX(pts[i], pts[(i + 1) % n], pts[j], pts[(j + 1) % n])) return true;
      }
    }
    return false;
  }

  // ---------- Formatting ----------
  const UNITS = [
    { name: 'acres',    f: m2 => m2 / 4046.8564224, d: 3, imperial: true },
    { name: 'hectares', f: m2 => m2 / 10000,        d: 3 },
    { name: 'm²',       f: m2 => m2,                d: 0 },
    { name: 'ft²',      f: m2 => m2 * 10.7639104,   d: 0, imperial: true },
    { name: 'km²',      f: m2 => m2 / 1e6,          d: 4 },
  ];
  let unitIdx = saved.unitIdx || 0;
  const fmt = (v, d) => v.toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });

  // Lengths follow the area unit: feet/miles with acres or ft², metres/km otherwise.
  function fmtDist(m) {
    if (UNITS[unitIdx].imperial) {
      const ft = m * 3.28083989;
      return ft >= 5280 ? fmt(ft / 5280, 2) + ' mi' : fmt(ft, 1) + ' ft';
    }
    return m >= 1000 ? fmt(m / 1000, 2) + ' km' : fmt(m, 1) + ' m';
  }

  // ---------- Points ----------
  // Points are Leaflet LatLngs with optional extras: acc (GPS accuracy in m, when the
  // point came from GPS) and mark (placed with the 📌 Mark button; never simplified away).
  function mkPt(lat, lng, acc, mark) {
    const p = L.latLng(lat, lng);
    if (acc != null && isFinite(acc)) p.acc = acc;
    if (mark) p.mark = true;
    return p;
  }
  const ser = p => [p.lat, p.lng, p.acc != null ? p.acc : null, p.mark ? 1 : 0];
  const deser = a => mkPt(a[0], a[1], a[2], a[3]);

  // ---------- Rendering ----------
  function vertexIcon(i, p) {
    return L.divIcon({
      className: '', iconSize: [22, 22], iconAnchor: [11, 11],
      html: `<div class="vtx${p.mark ? ' mark' : i === 0 ? ' first' : ''}">${i + 1}</div>`,
    });
  }

  function redraw() {
    markers.forEach(m => m.remove());
    markers.length = 0;
    points.forEach((p, i) => {
      const m = L.marker(p, { icon: vertexIcon(i, p), draggable: true, autoPan: true }).addTo(map);
      m.on('drag', e => {
        const ll = e.target.getLatLng();
        points[i] = mkPt(ll.lat, ll.lng, null, points[i].mark); // moved by hand: no longer a GPS reading
        polygon.setLatLngs(points); drawEdgeLabels(); updateStats();
      });
      m.on('dragend', () => save());
      m.on('click', () => {
        const q = points[i];
        const div = L.DomUtil.create('div');
        div.innerHTML = `<div style="margin-bottom:6px"><b>Point ${i + 1}</b>${q.mark ? ' 📌' : ''}<br>` +
          `<small>${q.lat.toFixed(7)}, ${q.lng.toFixed(7)}` +
          (q.acc != null ? `<br>GPS accuracy ±${q.acc.toFixed(1)} m` : '') + '</small></div>';
        const b = L.DomUtil.create('button', 'popbtn', div);
        b.textContent = 'Delete point';
        L.DomEvent.on(b, 'click', ev => { L.DomEvent.stop(ev); map.closePopup(); points.splice(i, 1); changed(); });
        L.popup({ offset: [0, -8] }).setLatLng(q).setContent(div).openOn(map);
      });
      markers.push(m);
    });
    polygon.setLatLngs(points);
    drawEdgeLabels();
    updateStats();
  }

  // Length of each side, written just above the middle of the line, along it.
  const edgeLabels = L.layerGroup().addTo(map);
  const MIN_LABEL_PX = 60; // skip sides too short on screen to fit a label
  function drawEdgeLabels() {
    edgeLabels.clearLayers();
    const n = points.length;
    if (n < 2 || walk) return;
    const sides = n < 3 ? 1 : n;
    for (let i = 0; i < sides; i++) {
      const a = points[i], b = points[(i + 1) % n];
      const pa = map.latLngToLayerPoint(a), pb = map.latLngToLayerPoint(b);
      if (pa.distanceTo(pb) < MIN_LABEL_PX) continue;
      let ang = Math.atan2(pb.y - pa.y, pb.x - pa.x) * 180 / Math.PI;
      if (ang > 90) ang -= 180;        // keep text upright
      else if (ang < -90) ang += 180;
      L.marker(map.layerPointToLatLng(pa.add(pb).divideBy(2)), {
        interactive: false, keyboard: false,
        icon: L.divIcon({
          className: '', iconSize: [0, 0],
          html: `<div class="elabel" style="transform: rotate(${ang}deg) translate(-50%, calc(-100% - 4px))">${fmtDist(dist(a, b))}</div>`,
        }),
      }).addTo(edgeLabels);
    }
  }
  map.on('zoomend', drawEdgeLabels);

  function fmtTime(ms) {
    const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = s % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(ss).padStart(2, '0');
  }

  function updateStats() {
    const pts = walk ? walk.track : points;
    const area = geodesicArea(pts);
    const u = UNITS[unitIdx];
    const main = document.getElementById('areaMain');
    if (pts.length < 3) {
      main.innerHTML = walk ? 'Walking… keep going'
        : pts.length === 0 ? 'Tap the map to add points'
        : `${pts.length} point${pts.length > 1 ? 's' : ''} &middot; need ${3 - pts.length} more`;
      document.getElementById('areaAlt').textContent = '';
    } else {
      main.innerHTML = `${walk ? '≈ ' : ''}${fmt(u.f(area), u.d)} ${u.name}<small>tap to change units</small>`;
      document.getElementById('areaAlt').textContent = UNITS
        .filter((_, i) => i !== unitIdx && i < 4)
        .map(x => `${fmt(x.f(area), x.d)} ${x.name}`).join('  ·  ');
    }
    document.getElementById('perim').textContent = pts.length >= 2 && !walk
      ? `${pts.length < 3 ? 'Length' : 'Perimeter'}: ${fmtDist(perimeter(pts))}` : '';
    const wi = document.getElementById('walkInfo');
    wi.style.display = walk ? 'block' : 'none';
    if (walk) {
      const t = walk.track, back = lastFix && t.length ? dist(lastFix.ll, t[0]) : 0;
      const marks = t.filter(p => p.mark).length;
      wi.textContent = `🚶 ⏱ ${fmtTime(Date.now() - walk.startedAt)} · ${t.length} pts` + (marks ? ` · ${marks} 📌` : '') +
        ` · walked ${fmtDist(walk.walked)}` + (t.length > 1 ? ` · start ${fmtDist(back)} away` : '') +
        (walk.waiting ? ` · ${walk.waiting}` : '');
    }
    document.getElementById('warn').style.display = selfIntersects(pts) ? 'block' : 'none';
    document.getElementById('btnUndo').disabled = !!walk || points.length === 0;
    updateMiniShape();
  }

  function changed() { redraw(); save(); }

  // ---------- Persistence (on this phone) ----------
  function load() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; }
  }
  function save() {
    try {
      const c = map.getCenter();
      localStorage.setItem(STORE_KEY, JSON.stringify({
        points: points.map(ser), unitIdx,
        view: { center: [c.lat, c.lng], zoom: map.getZoom() },
        // An unfinished walk is kept after every GPS point, so it survives the page being closed.
        walk: walk ? { track: walk.track.map(ser), walked: walk.walked, maxFromStart: walk.maxFromStart, startedAt: walk.startedAt } : null,
      }));
    } catch (e) { /* storage unavailable: fine, just don't persist */ }
  }
  map.on('moveend', save);

  // ---------- Toast ----------
  let toastT;
  function toast(msg, ms) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms || 2500);
  }

  // ---------- Interactions ----------
  map.on('click', e => {
    if (locked || walk) return;
    points.push(e.latlng);
    changed();
  });

  document.getElementById('areaMain').addEventListener('click', () => {
    if ((walk ? walk.track : points).length < 3) return;
    unitIdx = (unitIdx + 1) % UNITS.length; drawEdgeLabels(); updateStats(); save();
  });

  const btnLock = document.getElementById('btnLock');
  btnLock.addEventListener('click', () => {
    locked = !locked;
    btnLock.classList.toggle('on', locked);
    btnLock.querySelector('span:last-child').textContent = locked ? 'Locked' : 'Adding';
    btnLock.querySelector('.ic').textContent = locked ? '🔒' : '✋';
    toast(locked ? 'Taps no longer add points' : 'Tap the map to add points');
  });

  document.getElementById('btnUndo').addEventListener('click', () => { points.pop(); changed(); });

  // ---------- GPS ----------
  let meMarker = null, accCircle = null, lastFix = null, watchId = null;

  function gpsError(err) {
    const why = { 1: 'location permission denied, allow it in Chrome site settings', 2: 'position unavailable', 3: 'timed out' }[err && err.code];
    return 'GPS: ' + ((err && err.message) || why || 'error');
  }

  function gpsQuality(acc) {
    return acc <= 5 ? 'excellent' : acc <= 10 ? 'good' : acc <= 20 ? 'fair' : 'poor';
  }

  function showFix(pos) {
    const ll = L.latLng(pos.coords.latitude, pos.coords.longitude);
    lastFix = { ll, acc: pos.coords.accuracy, t: Date.now() };
    if (!meMarker) {
      meMarker = L.marker(ll, { icon: L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }), interactive: false }).addTo(map);
      accCircle = L.circle(ll, { radius: pos.coords.accuracy, color: '#3b82f6', weight: 1, fillOpacity: 0.1, interactive: false }).addTo(map);
    } else {
      meMarker.setLatLng(ll); accCircle.setLatLng(ll).setRadius(pos.coords.accuracy);
    }
    const a = pos.coords.accuracy;
    document.getElementById('gpsInfo').textContent = `GPS accuracy: ±${a < 10 ? a.toFixed(1) : Math.round(a)} m (${gpsQuality(a)})`;
    return lastFix;
  }

  function startWatch() {
    if (watchId !== null || !navigator.geolocation) return;
    watchId = navigator.geolocation.watchPosition(showFix, err => { if (err.code === 1) toast(gpsError(err)); },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
  }

  function getFix() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) return reject(new Error('GPS not available'));
      if (lastFix && Date.now() - lastFix.t < 3000) return resolve(lastFix);
      navigator.geolocation.getCurrentPosition(p => resolve(showFix(p)), reject,
        { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
    });
  }

  document.getElementById('btnLocate').addEventListener('click', async () => {
    toast('Finding you…');
    try {
      const f = await getFix();
      startWatch();
      map.setView(f.ll, Math.max(map.getZoom(), 18));
    } catch (e) { toast(gpsError(e)); }
  });

  // 📌 Mark: put a point exactly where you are right now. GPS keeps running after the
  // first mark (and always during a walk), so later marks are instant.
  async function addMark() {
    let f = lastFix && Date.now() - lastFix.t < 10000 ? lastFix : null;
    if (!f) {
      toast('Getting GPS fix…');
      try { f = await getFix(); } catch (e) { return toast(gpsError(e)); }
    }
    startWatch();
    const p = mkPt(f.ll.lat, f.ll.lng, f.acc, true);
    const accTxt = `±${f.acc < 10 ? f.acc.toFixed(1) : Math.round(f.acc)} m`;
    if (walk) {
      const t = walk.track, last = t[t.length - 1];
      if (last) walk.walked += dist(last, p);
      t.push(p);
      walk.maxFromStart = Math.max(walk.maxFromStart, dist(t[0], p));
      trackLine.setLatLngs(t); polygon.setLatLngs(t);
      L.circleMarker(p, { radius: 7, color: '#fff', weight: 2, fillColor: '#ef4444', fillOpacity: 1, interactive: false }).addTo(walkMarks);
      save(); updateStats();
      toast(`📌 Mark ${t.filter(q => q.mark).length} saved (${accTxt})`);
    } else {
      points.push(p);
      changed();
      if (!map.getBounds().contains(p)) map.panTo(p);
      toast(`📌 Point ${points.length} marked (${accTxt})`);
    }
    if (navigator.vibrate) navigator.vibrate(60);
  }
  document.getElementById('btnMark').addEventListener('click', addMark);

  // ---------- Walk the boundary ----------
  // Track GPS while you walk around the parcel; a point is recorded every few metres.
  // When you get back near where you started, the loop closes and the area is shown.
  const WALK_STEP = 3;        // record a point after moving at least this many metres
  const WALK_MAX_ACC = 25;    // ignore fixes worse than ±25 m
  const WALK_CLOSE_MIN = 6;   // "back at the start" radius in metres (grows with poor GPS, max 15)
  const WALK_SIMPLIFY = 1.5;  // drop points that deviate < 1.5 m from a straight line
  const WALK_STALL_MS = 20000; // no GPS for this long while on screen: restart GPS
  const trackLine = L.polyline([], { color: '#38bdf8', weight: 4, dashArray: '8 6', interactive: false }).addTo(map);
  const walkMarks = L.layerGroup().addTo(map);
  const btnWalk = document.getElementById('btnWalk');
  let wakeLock = null;

  async function keepScreenOn() {
    try { if (navigator.wakeLock && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } } catch (e) { /* not supported or not allowed right now */ }
  }
  function letScreenSleep() {
    try { if (wakeLock) wakeLock.release(); } catch (e) { /* ignore */ }
    wakeLock = null;
  }

  // Chrome pauses a page's GPS when the screen turns off or you switch apps.
  // Note how long that lasted, and restart GPS + screen lock as soon as we're back.
  document.addEventListener('visibilitychange', () => {
    if (!walk) return;
    if (document.visibilityState === 'hidden') { walk.hiddenAt = Date.now(); save(); return; }
    keepScreenOn();
    restartWalkWatch();
    if (walk.hiddenAt && Date.now() - walk.hiddenAt > 15000) {
      toast(`⚠ GPS was paused for ${fmtTime(Date.now() - walk.hiddenAt)} while the app was hidden. Keep it on screen.`, 6000);
    }
    walk.hiddenAt = null;
  });

  function setWalkButton(on) {
    btnWalk.classList.toggle('walking', on);
    btnWalk.querySelector('.ic').textContent = on ? '⏹️' : '🚶';
    btnWalk.querySelector('span:last-child').textContent = on ? 'Stop' : 'Walk';
  }

  function restartWalkWatch() {
    if (!walk) return;
    if (walk.watchId != null) navigator.geolocation.clearWatch(walk.watchId);
    walk.lastFixAt = Date.now();
    walk.watchId = navigator.geolocation.watchPosition(onWalkFix, err => {
      if (!walk) return;
      if (err.code === 1) { toast(gpsError(err)); return finishWalk(false); }
      walk.waiting = 'GPS signal lost, keep going…'; updateStats();
    }, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
  }

  // Every few seconds: refresh the timer, and restart GPS if it has gone quiet.
  setInterval(() => {
    if (!walk || document.visibilityState !== 'visible') return;
    if (Date.now() - walk.lastFixAt > WALK_STALL_MS) {
      walk.waiting = 'reconnecting GPS…';
      restartWalkWatch();
    }
    updateStats();
  }, 5000);

  function beginWalk(state) {
    walk = Object.assign({ track: [], walked: 0, maxFromStart: 0, startedAt: Date.now() }, state,
      { waiting: 'getting GPS…', watchId: null, hiddenAt: null });
    trackLine.setLatLngs(walk.track); polygon.setLatLngs(walk.track);
    walkMarks.clearLayers();
    walk.track.filter(p => p.mark).forEach(p =>
      L.circleMarker(p, { radius: 7, color: '#fff', weight: 2, fillColor: '#ef4444', fillOpacity: 1, interactive: false }).addTo(walkMarks));
    restartWalkWatch();
    keepScreenOn();
    setWalkButton(true);
    redraw();
    save();
  }

  function startWalk() {
    if (!navigator.geolocation) return toast('GPS not available');
    if (points.length && !confirm('Start walking a new boundary? This clears the current shape (save it first from ☰ More if you want to keep it).')) return;
    points = [];
    beginWalk({});
    toast('Walk the boundary. Keep this screen on. Tap 📌 Mark at corners.', 4000);
  }

  function onWalkFix(pos) {
    const f = showFix(pos);
    if (!walk) return;
    walk.lastFixAt = Date.now();
    if (f.acc > WALK_MAX_ACC) {
      walk.waiting = `weak GPS (±${Math.round(f.acc)} m), waiting…`;
      return updateStats();
    }
    walk.waiting = '';
    const t = walk.track, last = t[t.length - 1];
    if (!last) map.setView(f.ll, Math.max(map.getZoom(), 18));
    if (last && dist(last, f.ll) < WALK_STEP) return updateStats();
    const p = mkPt(f.ll.lat, f.ll.lng, f.acc);
    if (last) walk.walked += dist(last, p);
    t.push(p);
    const fromStart = dist(t[0], p);
    walk.maxFromStart = Math.max(walk.maxFromStart, fromStart);
    trackLine.setLatLngs(t);
    polygon.setLatLngs(t);
    if (!map.getBounds().pad(-0.25).contains(p)) map.panTo(p);
    save();
    // Loop closed: we went properly away from the start and are now back near it.
    const closeR = Math.max(WALK_CLOSE_MIN, Math.min(f.acc, 15));
    if (t.length >= 4 && walk.maxFromStart > 2 * closeR + 10 && fromStart <= closeR) return finishWalk(true);
    updateStats();
  }

  // Remove GPS jitter: keep only the points needed to describe the shape.
  function simplifyLine(lls) {
    if (lls.length < 3) return lls.slice();
    const o = lls[0], kx = 111320 * Math.cos(rad(o.lat)), ky = 110574;
    const pts = lls.map((ll, i) => {
      const p = L.point((ll.lng - o.lng) * kx, (ll.lat - o.lat) * ky);
      p.i = i;
      return p;
    });
    return L.LineUtil.simplify(pts, WALK_SIMPLIFY).map(p => lls[p.i]);
  }
  // Same, but 📌 marks are always kept: simplify the stretches between them separately.
  // The shape is a closed loop, so the stretch back to the start is cleaned up too.
  function simplifyTrack(lls) {
    if (lls.length < 4) return lls.slice();
    lls = [...lls, lls[0]];
    const out = [];
    let seg = [lls[0]];
    for (let i = 1; i < lls.length; i++) {
      seg.push(lls[i]);
      if (lls[i].mark || i === lls.length - 1) {
        const s = simplifyLine(seg);
        out.push(...(out.length ? s.slice(1) : s));
        seg = [lls[i]];
      }
    }
    return out.slice(0, -1); // drop the repeated start point
  }

  function finishWalk(closed) {
    if (walk.watchId != null) navigator.geolocation.clearWatch(walk.watchId);
    letScreenSleep();
    let t = walk.track;
    // A last point practically on top of the first adds nothing: the shape closes itself.
    if (t.length > 3 && !t[t.length - 1].mark && dist(t[t.length - 1], t[0]) < WALK_CLOSE_MIN) t = t.slice(0, -1);
    walk = null;
    trackLine.setLatLngs([]);
    walkMarks.clearLayers();
    setWalkButton(false);
    points = simplifyTrack(t);
    changed();
    if (points.length >= 3) {
      map.fitBounds(polygon.getBounds(), { padding: [60, 60], maxZoom: 20 });
      toast((closed ? '✅ Loop closed!' : 'Walk stopped, shape closed for you.') + ' Save it from ☰ More.', 4000);
    } else {
      toast('Walk stopped: not enough points for an area');
    }
  }

  btnWalk.addEventListener('click', () => {
    if (!walk) return startWalk();
    if (confirm('Stop walking and close the shape?')) finishWalk(false);
  });

  // ---------- Save / open files ----------
  const sheet = document.getElementById('sheet');
  const fileIn = document.getElementById('fileIn');
  const r8 = x => Math.round(x * 1e8) / 1e8;   // 8 decimals ≈ 1 mm, far finer than any GPS
  const rnd = (x, d) => Math.round(x * 10 ** d) / 10 ** d;
  const xmlEsc = s => String(s).replace(/[<>&'"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', "'": '&apos;', '"': '&quot;' }[c]));

  function stamp() {
    const d = new Date(), z = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())} ${z(d.getHours())}.${z(d.getMinutes())}`;
  }

  function summary() {
    const a = geodesicArea(points);
    return {
      area_m2: rnd(a, 2), area_acres: rnd(a / 4046.8564224, 4), area_hectares: rnd(a / 1e4, 4),
      perimeter_m: rnd(perimeter(points), 2),
    };
  }

  function toGeoJSON(name) {
    const c = points.map(p => [r8(p.lng), r8(p.lat)]);
    const geometry = points.length >= 3 ? { type: 'Polygon', coordinates: [[...c, c[0]]] }
      : points.length === 2 ? { type: 'LineString', coordinates: c }
      : { type: 'Point', coordinates: c[0] };
    return JSON.stringify({
      type: 'FeatureCollection',
      features: [{
        type: 'Feature', geometry,
        properties: Object.assign({ name, app: 'Area Calculator', saved_at: new Date().toISOString() }, summary(), {
          points: points.map((p, i) => ({
            n: i + 1, lat: r8(p.lat), lng: r8(p.lng),
            gps_accuracy_m: p.acc != null ? rnd(p.acc, 1) : null, mark: !!p.mark,
          })),
        }),
      }],
    }, null, 1);
  }

  function toKML(name) {
    const s = summary();
    const coords = [...points, points[0]].map(p => `${r8(p.lng)},${r8(p.lat)},0`).join(' ');
    const shape = points.length >= 3
      ? `<Polygon><outerBoundaryIs><LinearRing><coordinates>${coords}</coordinates></LinearRing></outerBoundaryIs></Polygon>`
      : `<LineString><coordinates>${points.map(p => `${r8(p.lng)},${r8(p.lat)},0`).join(' ')}</coordinates></LineString>`;
    const pins = points.map((p, i) =>
      `<Placemark><name>${i + 1}${p.mark ? ' 📌' : ''}</name>` +
      (p.acc != null ? `<description>GPS accuracy ±${rnd(p.acc, 1)} m</description>` : '') +
      `<Point><coordinates>${r8(p.lng)},${r8(p.lat)},0</coordinates></Point></Placemark>`).join('\n');
    return `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${xmlEsc(name)}</name>
<Style id="area"><LineStyle><color>ff15ccfa</color><width>3</width></LineStyle><PolyStyle><color>4015ccfa</color></PolyStyle></Style>
<Placemark><name>${xmlEsc(name)}</name><styleUrl>#area</styleUrl>
<description>Area: ${s.area_m2} m² = ${s.area_acres} acres = ${s.area_hectares} ha. Perimeter: ${s.perimeter_m} m</description>
${shape}</Placemark>
<Folder><name>Points</name>
${pins}
</Folder></Document></kml>`;
  }

  function download(filename, text, mime) {
    const url = URL.createObjectURL(new Blob([text], { type: mime }));
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  }

  function saveFile(kind) {
    if (!points.length) return toast('Nothing to save yet');
    const name = prompt('Name for this shape:', `Parcel ${stamp()}`);
    if (name === null) return;
    const base = (name.trim() || `Parcel ${stamp()}`).replace(/[\\/:*?"<>|]+/g, '-');
    if (kind === 'kml') download(base + '.kml', toKML(name), 'application/vnd.google-earth.kml+xml');
    else download(base + '.geojson', toGeoJSON(name), 'application/geo+json');
    toast('Saved to your Downloads folder');
  }

  // Read GeoJSON (ours or any), KML (Google Earth) or GPX (GPS logger apps).
  function parseShapeFile(text) {
    text = text.replace(/^﻿/, '').trim();
    let pts = [], name = '', ours = false, track = false;
    if (text[0] === '{' || text[0] === '[') {
      const j = JSON.parse(text);
      const feats = j.type === 'FeatureCollection' ? j.features : j.type === 'Feature' ? [j] : [{ geometry: j, properties: {} }];
      const geomOf = f => f && f.geometry;
      const pick = types => feats.find(f => geomOf(f) && types.includes(geomOf(f).type));
      let f = pick(['Polygon', 'MultiPolygon']);
      if (f) {
        const g = f.geometry;
        pts = (g.type === 'Polygon' ? g.coordinates[0] : g.coordinates[0][0]).map(c => mkPt(c[1], c[0]));
      } else if ((f = pick(['LineString', 'MultiLineString']))) {
        const g = f.geometry;
        pts = (g.type === 'LineString' ? g.coordinates : g.coordinates[0]).map(c => mkPt(c[1], c[0]));
        track = pts.length > 30;
      } else {
        pts = feats.filter(x => geomOf(x) && x.geometry.type === 'Point').map(x => mkPt(x.geometry.coordinates[1], x.geometry.coordinates[0]));
        f = feats[0];
      }
      const props = (f && f.properties) || {};
      name = props.name || '';
      ours = props.app === 'Area Calculator';
      if (ours && Array.isArray(props.points)) {
        // Our own file: restore the exact points with their GPS accuracy and marks.
        pts = props.points.map(q => mkPt(q.lat, q.lng, q.gps_accuracy_m, q.mark));
      }
    } else {
      const doc = new DOMParser().parseFromString(text, 'application/xml');
      if (doc.getElementsByTagName('parsererror').length) throw new Error('not a valid file');
      const tags = t => Array.from(doc.getElementsByTagNameNS('*', t));
      const kmlCoords = el => el.textContent.trim().split(/\s+/).map(s => s.split(',').map(Number))
        .filter(c => c.length >= 2 && isFinite(c[0]) && isFinite(c[1])).map(c => mkPt(c[1], c[0]));
      if (doc.documentElement.localName === 'gpx') {
        const ll = el => mkPt(+el.getAttribute('lat'), +el.getAttribute('lon'));
        const trk = tags('trkpt'), rte = tags('rtept'), wpt = tags('wpt');
        pts = (trk.length ? trk : rte.length ? rte : wpt).map(ll);
        track = trk.length > 0;
        const n = tags('name')[0]; name = n ? n.textContent : '';
      } else {
        const poly = tags('Polygon')[0], line = tags('LineString')[0], gx = tags('coord');
        if (poly) pts = kmlCoords(tags('coordinates').find(c => poly.contains(c)));
        else if (line) { pts = kmlCoords(line.getElementsByTagNameNS('*', 'coordinates')[0]); track = pts.length > 30; }
        else if (gx.length) { pts = gx.map(c => c.textContent.trim().split(/\s+/).map(Number)).map(c => mkPt(c[1], c[0])); track = true; }
        else pts = tags('Point').flatMap(p => kmlCoords(p.getElementsByTagNameNS('*', 'coordinates')[0]));
        const n = tags('name')[0]; name = n ? n.textContent : '';
      }
    }
    pts = pts.filter(p => isFinite(p.lat) && isFinite(p.lng));
    // A closed ring repeats its first point at the end; we don't need that.
    if (pts.length > 2 && pts[0].equals(pts[pts.length - 1], 1e-10)) pts.pop();
    if (track) pts = simplifyTrack(pts);
    return { pts, name };
  }

  async function openFile(file) {
    try {
      const { pts, name } = parseShapeFile(await file.text());
      if (!pts.length) return toast('No points found in that file');
      if (points.length && !confirm(`Replace the current shape with "${name || file.name}"?`)) return;
      points = pts;
      changed();
      map.fitBounds(L.latLngBounds(points), { padding: [60, 60], maxZoom: 20 });
      toast(`Opened ${name || file.name}: ${points.length} points`);
    } catch (e) {
      toast("Couldn't read that file (" + e.message + ')', 4000);
    }
  }

  document.getElementById('btnMore').addEventListener('click', () => {
    sheet.querySelectorAll('[data-act="saveGeo"],[data-act="saveKml"],[data-act="clear"]').forEach(b => { b.disabled = !points.length; });
    sheet.querySelector('[data-act="open"]').disabled = !!walk;
    sheet.hidden = false;
  });
  sheet.addEventListener('click', e => {
    const act = e.target.closest('button') ? e.target.closest('button').dataset.act : (e.target === sheet ? 'close' : null);
    if (!act) return;
    sheet.hidden = true;
    if (act === 'saveGeo') saveFile('geojson');
    else if (act === 'saveKml') saveFile('kml');
    else if (act === 'open') fileIn.click();
    else if (act === 'clear' && confirm('Clear all points?')) { points = []; changed(); }
  });
  fileIn.addEventListener('change', () => {
    const f = fileIn.files[0];
    fileIn.value = '';
    if (f) openFile(f);
  });


  // ---------- Overview map (top right) ----------
  // When zoomed in close, a small map shows the wider area with a red box for
  // what's on screen, so you don't get lost. Tap it to jump there.
  const MINI_FROM_ZOOM = 16, MINI_ZOOM_OUT = 4;
  const miniEl = document.getElementById('mini');
  const mini = L.map(miniEl, {
    zoomControl: false, attributionControl: false, dragging: false, touchZoom: false,
    scrollWheelZoom: false, doubleClickZoom: false, boxZoom: false, keyboard: false,
    zoomAnimation: false, fadeAnimation: false, inertia: false,
  });
  new EsriImagery({ maxZoom: 22 }).addTo(mini);
  const miniShape = L.polygon([], { color: '#facc15', weight: 2, fillOpacity: 0.2, interactive: false }).addTo(mini);
  const miniBox = L.rectangle([[0, 0], [0, 0]], { color: '#ef4444', weight: 2, fillOpacity: 0.15, interactive: false }).addTo(mini);

  function updateMini() {
    const show = map.getZoom() >= MINI_FROM_ZOOM;
    const wasHidden = miniEl.style.display !== 'block';
    miniEl.style.display = show ? 'block' : 'none';
    if (!show) return;
    if (wasHidden) mini.invalidateSize();
    mini.setView(map.getCenter(), map.getZoom() - MINI_ZOOM_OUT, { animate: false });
    miniBox.setBounds(map.getBounds());
    miniShape.setLatLngs(polygon.getLatLngs());
  }
  function updateMiniShape() { if (miniEl.style.display === 'block') miniShape.setLatLngs(polygon.getLatLngs()); }
  map.on('move zoomend', updateMini);
  mini.on('click', e => map.panTo(e.latlng));

  // ---------- Start ----------
  redraw();
  updateMini();
  if (points.length >= 1 && !saved.view) map.fitBounds(L.latLngBounds(points), { padding: [60, 60] });
  // The page was closed (or Android killed it) in the middle of a walk: offer to carry on.
  if (saved.walk && saved.walk.track && saved.walk.track.length) {
    const w = saved.walk, n = w.track.length;
    if (confirm(`A walk was still in progress (${n} points, started ${fmtTime(Date.now() - w.startedAt)} ago). Continue it?\n\nOK = continue walking, Cancel = finish it now`)) {
      beginWalk({ track: w.track.map(deser), walked: w.walked, maxFromStart: w.maxFromStart, startedAt: w.startedAt });
      toast('Walk resumed', 3000);
    } else {
      walk = { track: w.track.map(deser), walked: w.walked, maxFromStart: w.maxFromStart, startedAt: w.startedAt };
      finishWalk(false);
    }
  }

  // Expose for testing.
  window.__areacalc = { geodesicArea, perimeter, selfIntersects, dist, simplifyTrack, parseShapeFile, toGeoJSON, toKML, get points() { return points; }, get walk() { return walk; } };
})();
</script>
</body>
</html>
